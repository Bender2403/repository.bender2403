name: Validate Kodi addons

on:
  push:
    branches:
      - main
    paths:
      - 'addons/**'
      - 'scripts/build_repo.py'
      - 'scripts/zip_safety.py'
      - 'scripts/zip_intake.py'
      - '.github/scripts/check_kodi_versions.py'
      - '.github/scripts/test_kodi_version_compatibility.py'
      - '.github/scripts/test_zip_safety.py'
      - '.github/scripts/test_zip_intake.py'
      - '.github/scripts/test_build_repo_integration.py'
      - '.github/scripts/validate_kodi_addon.py'
      - '.github/scripts/restore_kodi_addon.py'
      - '.github/scripts/test_kodi_addon_validation.py'
      - '.github/workflows/validate-kodi-addon.yml'
      - '.github/workflows/restore-kodi-addons.yml'
      - '.github/trigger/validate-kodi-addons.txt'
  pull_request:
    paths:
      - 'addons/**'
      - 'scripts/build_repo.py'
      - 'scripts/zip_safety.py'
      - '.github/scripts/check_kodi_versions.py'
      - '.github/scripts/test_kodi_version_compatibility.py'
      - '.github/scripts/test_zip_safety.py'
      - '.github/scripts/validate_kodi_addon.py'
      - '.github/scripts/restore_kodi_addon.py'
      - '.github/scripts/test_kodi_addon_validation.py'
      - '.github/workflows/validate-kodi-addon.yml'
      - '.github/workflows/restore-kodi-addons.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodi-repository-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate addon sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run validator and restore unit tests
        # Includes ZIP intake and full repository-build integration tests.
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate addon sources
        id: validation
        continue-on-error: true
        env:
          VALIDATION_REPORT: ${{ runner.temp }}/kodi-addon-validation.txt
        run: |
          : > "$VALIDATION_REPORT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 .github/scripts/validate_kodi_addon.py --quarantine --report "$VALIDATION_REPORT"
          else
            python3 .github/scripts/validate_kodi_addon.py --report "$VALIDATION_REPORT"
          fi
          status=$?
          cat "$VALIDATION_REPORT"
          exit "$status"

      - name: Commit quarantined addons
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- addons
          if [ -d _quarantine ]; then
            git add -A -- _quarantine
          fi
          if git diff --cached --quiet; then
            echo 'No addon changes to commit.'
          else
            git commit -m 'Quarantine Kodi addons with validation errors'
            git pull --rebase origin main
            git push origin HEAD:refs/heads/main
          fi

      - name: Remove validation trigger
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git rebase origin/main
          if git ls-files --error-unmatch .github/trigger/validate-kodi-addons.txt >/dev/null 2>&1; then
            git rm .github/trigger/validate-kodi-addons.txt
            git commit -m 'Remove Kodi validation trigger'
            git push origin HEAD:refs/heads/main
          else
            echo 'Validation trigger is not present.'
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kodi-addon-validation-report
          path: ${{ runner.temp }}/kodi-addon-validation.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Fail pull request when validation finds errors
        if: github.event_name == 'pull_request' && steps.validation.outcome == 'failure'
        run: exit 1

  kodi-compatibility:
    name: Kodi ${{ matrix.kodi_label }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - kodi_branch: nexus
            kodi_label: 20 Nexus
          - kodi_branch: omega
            kodi_label: 21 Omega
          - kodi_branch: piers
            kodi_label: 22 Piers
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install official Kodi add-on checker
        run: python3 -m pip install 'kodi-addon-checker==0.0.36'

      - name: Check Kodi ${{ matrix.kodi_label }}
        run: |
          python3 .github/scripts/check_kodi_versions.py \
            --addons-dir addons \
            --report-dir "${{ runner.temp }}/kodi-compatibility-reports" \
            --branch "${{ matrix.kodi_branch }}"

      - name: Upload Kodi compatibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kodi-compatibility-${{ matrix.kodi_branch }}
          path: ${{ runner.temp }}/kodi-compatibility-reports/kodi-compatibility-${{ matrix.kodi_branch }}.txt
          if-no-files-found: warn
          retention-days: 14

name: Kodi-Repository bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [addon-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kodi-repository-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ZIP-Sicherheits- und Validator-Regressionstests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Offiziellen Kodi-Addon-Checker installieren
        run: python3 -m pip install 'kodi-addon-checker==0.0.36'
      - name: Kodi 20 Nexus, Kodi 21 Omega und Kodi 22 Piers prüfen
        run: |
          python3 .github/scripts/check_kodi_versions.py \
            --addons-dir addons \
            --report-dir "${{ runner.temp }}/kodi-compatibility-reports"
      - name: Kodi-Kompatibilitätsberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi-version-compatibility-reports
          path: ${{ runner.temp }}/kodi-compatibility-reports/*.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Kodi-Repository-Dateien bauen
        run: python scripts/build_repo.py
      - name: Generierte Dateien veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- addons.xml addons.xml.md5 arbeitsordner
          while IFS= read -r addon_dir; do
            [ -n "$addon_dir" ] && git add -A -- "$addon_dir"
          done < generated-addon-dirs.txt
          rm generated-addon-dirs.txt
          if ! git diff --cached --quiet; then
            git commit -m "Kodi-Repository automatisch aktualisieren"
            git pull --rebase origin main
            git push
          else
            echo "Keine Änderungen an den Repository-Dateien."
          fi
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Kompatibilitätsdateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

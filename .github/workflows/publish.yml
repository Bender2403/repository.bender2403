name: Kodi-Repository bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kodi-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Kodi-Repository-Dateien bauen
        run: python scripts/build_repo.py
      - name: Generierte Dateien veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- addons.xml addons.xml.md5
          while IFS= read -r addon_dir; do
            [ -n "$addon_dir" ] && git add -A -- "$addon_dir"
          done < generated-addon-dirs.txt
          rm generated-addon-dirs.txt
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Repository-Dateien."
            exit 0
          fi
          git commit -m "Kodi-Repository automatisch aktualisieren"
          git push

name: Kodi-Repository bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [addon-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kodi-repository
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Kodi-Repository-Dateien bauen
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: python scripts/build_repo.py
      - name: Generierte Dateien veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- addons.xml addons.xml.md5
          while IFS= read -r addon_dir; do
            [ -n "$addon_dir" ] && git add -A -- "$addon_dir"
          done < generated-addon-dirs.txt
          rm generated-addon-dirs.txt
          if ! git diff --cached --quiet; then
            git commit -m "Kodi-Repository automatisch aktualisieren"
            git push
          else
            echo "Keine Änderungen an den Repository-Dateien."
          fi
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5
      - name: Kompatibilitätsdateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
